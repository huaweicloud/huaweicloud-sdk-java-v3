name: Publish packages to the Maven Central Repository
on:
  workflow_dispatch:
  release:
    types: [created]
permissions:
  contents: read
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          java-version: '8.0.352'
          java-distribution: 'temurin'
          maven-version: 3.9.16
          settings-servers: |
            [
              {
                "id": "central",
                "username": "${{ secrets.TOKEN_USERNAME }}",
                "password": "${{ secrets.TOKEN_PASSWORD }}"
              }
            ]
      - name: Import GPG Key
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Publish to Maven Central
        run: mvn -B clean deploy -P release -Dgpg.passphrase="$GPG_PASSPHRASE"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
